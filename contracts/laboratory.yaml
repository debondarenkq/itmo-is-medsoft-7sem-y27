components:
  schemas:
    LabError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    LabTestInput:
      type: object
      properties:
        code:
          type: string
          pattern: "^\\d{1,8}-\\d$"
        name:
          type: string
          minLength: 3
          maxLength: 160
      required:
      - code
      - name
      additionalProperties: false
    LabTest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        active:
          type: boolean
      required:
      - id
      - code
      - name
      - active
      additionalProperties: false
    LabTestList:
      type: array
      items:
        "$ref": "#/components/schemas/LabTest"
    LabOrderInput:
      type: object
      properties:
        patient_id:
          type: string
          format: uuid
        test_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 20
        comment:
          type: string
          maxLength: 512
      required:
      - patient_id
      - test_ids
      additionalProperties: false
    LabConnection:
      type: object
      properties:
        online:
          type: boolean
        fhir_version:
          type: string
      required:
      - online
      - fhir_version
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
security:
- BearerAuth: []
