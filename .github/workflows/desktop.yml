name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SwiftUI / macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: xcodebuild -project macos/HIS.xcodeproj -scheme HIS -configuration Debug -destination platform=macOS -derivedDataPath macos/build/DerivedData build
      - run: ./macos/build.sh
      - run: ditto -c -k --sequesterRsrc --keepParent macos/build/HIS.app macos/build/HIS-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HIS-macos
          path: macos/build/HIS-macos.zip
