services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: his_admin
      POSTGRES_PASSWORD: his_local
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U his_admin -d postgres']
      interval: 2s
      timeout: 2s
      retries: 20
