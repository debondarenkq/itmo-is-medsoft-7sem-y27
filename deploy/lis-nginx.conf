events {}
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream lis_backend {
        zone lis_backend 64k;
        server lis-service:8080 resolve;
    }
    server {
        listen 80;
        listen 443 ssl;
        ssl_protocols TLSv1.3;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        location /lis/v1/ { proxy_pass http://lis_backend; }
        location = /live { default_type application/json; return 200 '{"status":"ok"}'; }
        location / { return 404; }
    }
}
