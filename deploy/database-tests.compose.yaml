services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: his_admin
      POSTGRES_PASSWORD: his_local
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - ./his-postgres-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./his-laboratory-init.sh:/docker-entrypoint-initdb.d/002-laboratory.sh:ro
      - ./security/services/database-laboratory.password:/security/database-laboratory.password:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U his_admin -d postgres']
      interval: 2s
      timeout: 2s
      retries: 20

  lis-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lis_user
      POSTGRES_PASSWORD_FILE: /security/database.password
      POSTGRES_DB: lis
    ports:
      - '127.0.0.1:55435:5432'
    volumes:
      - ./security/services/database-lis.password:/security/database.password:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lis_user -d lis']
      interval: 2s
      timeout: 2s
      retries: 20
