events {}
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream staff_backend {
        zone staff_backend 64k;
        server staff-service:8080 resolve;
    }
    upstream catalog_backend {
        zone catalog_backend 64k;
        server catalog-service:8080 resolve;
    }
    upstream clinical_backend {
        zone clinical_backend 64k;
        server clinical-service:8080 resolve;
    }
    server {
        listen 80;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;

        location = /docs/staff/openapi.json {
            proxy_pass http://staff_backend/openapi.json;
        }
        location = /docs/catalog/openapi.json {
            proxy_pass http://catalog_backend/openapi.json;
        }
        location = /docs/clinical/openapi.json {
            proxy_pass http://clinical_backend/openapi.json;
        }

        location /api/v1/staff {
            proxy_pass http://staff_backend;
        }
        location /api/v1/diagnoses {
            proxy_pass http://catalog_backend;
        }
        location /api/v1/patients {
            proxy_pass http://clinical_backend;
        }
        location /api/v1/records {
            proxy_pass http://clinical_backend;
        }
        location = /live {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
        location / {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"Endpoint not found"}}';
        }
    }
}
